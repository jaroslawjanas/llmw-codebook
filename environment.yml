name: llmw-codebook
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch::pytorch=2.5.1
  - pytorch::pytorch-cuda=11.8 # 12.4
  - transformers=4.51.3
  - datasets=3.6.0
  - tqdm=4.67.1
  - numpy>=2
  - sentencepiece=0.2.0
  - pillow>=11, <12 # Some models might need this for AutoProcessor
  - scipy>=1.1
  - matplotlib>=3.10
  - seaborn>=0.13
  - numba>=0.61
  - rapidfuzz=3.14.3
  - c-compiler  # Needed by Triton to build CUDA utilities
  - pip
  - pip:
    - accelerate==1.7.0
    - huggingface_hub==0.33.0
    - protobuf==6.32.0
    - faiss-cpu>=1.12.0
    - galois==0.4.6
    # Triton (--distance levenshtein-triton): uncomment ONE line for your platform
    - triton-windows>=3.0.0  # Windows
    # - triton>=3.0.0  # Linux (if libcuda.so missing: ln -s libcuda.so.1 libcuda.so)Sta